version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One PR for all dev tooling updates, one for runtime dependencies.
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    ignore:
      # Must stay in step with engines.vscode in package.json.
      - dependency-name: '@types/vscode'
      # @vscode/markdown-it-katex declares katex ^0.16 as a peer dependency; lift this when it moves on.
      - dependency-name: katex
        versions: ['>=0.17.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
